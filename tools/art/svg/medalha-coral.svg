<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" aria-hidden="true">
  <defs>
    <!-- as listras da fita são recortadas pela própria silhueta, para não vazar no bico -->
    <clipPath id="fitaCoral"><path d="M19 9 H45 V38 L32 46 L19 38 Z"/></clipPath>
  </defs>
  <!-- sombra dura: silhueta inteira deslocada (0,+3), tinta a 28%, sem desfoque (cartaz serigráfico) -->
  <g fill="#1A1A1A" opacity=".28">
    <rect x="15" y="5" width="34" height="7" rx="2"/>
    <path d="M19 12 H45 V41 L32 49 L19 41 Z"/>
    <circle cx="32" cy="67" r="19"/>
  </g>
  <!-- fita: laterais na cor do vencedor (jogador 1), miolo creme -->
  <g clip-path="url(#fitaCoral)">
    <rect x="19" y="9" width="26" height="37" fill="#F4EBD9"/>
    <rect x="19" y="9" width="8" height="37" fill="#F3937A"/>
    <rect x="37" y="9" width="8" height="37" fill="#F3937A"/>
  </g>
  <path d="M19 9 H45 V38 L32 46 L19 38 Z" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linejoin="round"/>
  <!-- presilha -->
  <rect x="15" y="2" width="34" height="7" rx="2" fill="#E8B23C" stroke="#1A1A1A" stroke-width="3"/>
  <!-- disco + anel interno (detalhe 2,0) -->
  <circle cx="32" cy="64" r="19" fill="#E8B23C" stroke="#1A1A1A" stroke-width="3"/>
  <circle cx="32" cy="64" r="13" fill="none" stroke="#A9713F" stroke-width="2"/>
  <!-- símbolo: a pazinha do jogo, estilizada e centrada no disco -->
  <rect x="30.5" y="52" width="3" height="10" rx="1.5" fill="#C4503A"/>
  <path d="M25 62 H39 L36.5 72 Q32 77 27.5 72 Z" fill="#F4EBD9" stroke="#C4503A" stroke-width="2" stroke-linejoin="round"/>
</svg>
